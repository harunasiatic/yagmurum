<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1b0b2e" />
  <meta name="description" content="Yağmur'a Harun'dan küçük bir sevgi mesajı." />
  <title>Yağmur'a, Harun'dan ❤️</title>
  <style>
    :root {
      --pink: #ff4f91;
      --light-pink: #ffd4e5;
      --purple: #8f5cff;
      --night: #160822;
      --white: #fff9fc;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 79, 145, 0.35), transparent 30%),
        radial-gradient(circle at 80% 25%, rgba(143, 92, 255, 0.35), transparent 34%),
        linear-gradient(145deg, #13061f, #2a0d3e 58%, #180922);
      cursor: pointer;
      user-select: none;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      opacity: 0.35;
      background-image:
        radial-gradient(circle, #ffffff 0 1px, transparent 1.4px),
        radial-gradient(circle, #ffd4e5 0 1px, transparent 1.5px);
      background-position: 0 0, 35px 55px;
      background-size: 80px 80px, 110px 110px;
      animation: stars 16s linear infinite;
    }

    body::after {
      content: "";
      position: fixed;
      inset: -30%;
      z-index: -1;
      background: conic-gradient(
        from 0deg,
        transparent,
        rgba(255, 79, 145, 0.12),
        transparent,
        rgba(143, 92, 255, 0.12),
        transparent
      );
      animation: glow 18s linear infinite;
    }

    .card {
      width: min(620px, 100%);
      padding: clamp(30px, 7vw, 58px) clamp(22px, 7vw, 54px);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.09);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.36),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: enter 0.9s cubic-bezier(.2,.8,.2,1) both;
    }

    .heart-main {
      position: relative;
      display: inline-grid;
      place-items: center;
      width: 104px;
      height: 104px;
      margin-bottom: 18px;
      font-size: 64px;
      filter: drop-shadow(0 12px 24px rgba(255, 79, 145, 0.45));
      animation: heartbeat 1.45s ease-in-out infinite;
    }

    .heart-main::before,
    .heart-main::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255, 212, 229, 0.42);
      animation: pulse 2.2s ease-out infinite;
    }

    .heart-main::before { inset: 3px; }
    .heart-main::after {
      inset: -12px;
      animation-delay: 0.7s;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--light-pink);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.45rem, 9vw, 5rem);
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -0.045em;
      background: linear-gradient(110deg, #ffffff 15%, #ffd0e2 48%, #cbb7ff 85%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-wrap: balance;
    }

    .subtitle {
      max-width: 440px;
      margin: 20px auto 0;
      color: rgba(255, 249, 252, 0.8);
      font-size: clamp(1rem, 3.5vw, 1.18rem);
      line-height: 1.7;
    }

    .tap-hint {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(120deg, rgba(255, 79, 145, 0.24), rgba(143, 92, 255, 0.24));
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
      font-size: 0.92rem;
      font-weight: 700;
      animation: hint 2s ease-in-out infinite;
    }

    .tap-icon {
      display: inline-block;
      font-size: 1.25rem;
      animation: tap 1.3s ease-in-out infinite;
    }

    .signature {
      margin-top: 25px;
      color: rgba(255, 212, 229, 0.86);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      font-style: italic;
    }

    .love-message {
      position: fixed;
      z-index: 20;
      max-width: min(310px, 78vw);
      padding: 12px 17px;
      pointer-events: none;
      color: #3a0c25;
      background: rgba(255, 249, 252, 0.96);
      border: 1px solid rgba(255, 79, 145, 0.2);
      border-radius: 999px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.25);
      font-size: clamp(0.84rem, 3.5vw, 1rem);
      font-weight: 800;
      text-align: center;
      white-space: nowrap;
      transform: translate(-50%, -50%);
      animation: message-pop 2.4s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .floating-heart {
      position: fixed;
      z-index: 15;
      pointer-events: none;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 7px 10px rgba(0, 0, 0, 0.2));
      animation: heart-float var(--duration) ease-out forwards;
    }

    .counter {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 30;
      padding: 9px 13px;
      color: rgba(255, 249, 252, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(18, 6, 31, 0.45);
      backdrop-filter: blur(10px);
      font-size: 0.75rem;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(28px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      12% { transform: scale(1.12); }
      24% { transform: scale(1); }
      36% { transform: scale(1.08); }
      52% { transform: scale(1); }
    }

    @keyframes pulse {
      0% { opacity: 0.8; transform: scale(0.76); }
      100% { opacity: 0; transform: scale(1.45); }
    }

    @keyframes stars {
      to { background-position: 80px 80px, -75px 165px; }
    }

    @keyframes glow {
      to { transform: rotate(360deg); }
    }

    @keyframes hint {
      50% { transform: translateY(-4px); }
    }

    @keyframes tap {
      50% { transform: translateY(3px) scale(0.92); }
    }

    @keyframes message-pop {
      0% { opacity: 0; transform: translate(-50%, -35%) scale(0.65); }
      14% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
      25% { transform: translate(-50%, -50%) scale(1); }
      72% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -135%) scale(0.94); }
    }

    @keyframes heart-float {
      0% { opacity: 0; transform: translate(-50%, -30%) scale(0.55) rotate(0deg); }
      14% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--drift)), -190px) scale(1.25) rotate(var(--rotate));
      }
    }

    @media (max-width: 520px) {
      body { padding: 16px; }
      .card { border-radius: 28px; }
      .heart-main { width: 88px; height: 88px; font-size: 55px; }
      .counter { right: 12px; bottom: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body aria-label="Ekrana her dokunduğunda Harun'un sevgi mesajı görünür.">
  <main class="card">
    <div class="heart-main" aria-hidden="true">❤️</div>
    <p class="eyebrow">Harun'dan küçük bir not</p>
    <h1>Yağmur'um</h1>
    <p class="subtitle">
      Dünyanın herhangi bir yerine dokun; sana söylemek istediğim şey her defasında yeniden karşına çıksın.
    </p>
    <div class="tap-hint">
      <span class="tap-icon" aria-hidden="true">👆</span>
      Ekranın herhangi bir yerine dokun
    </div>
    <div class="signature">Daima senin, Harun.</div>
  </main>

  <div class="counter" id="counter" aria-live="polite">Sevgi mesajı: 0</div>

  <script>
    const messages = [
      "Harun seni çok seviyormuş ❤️",
      "Harun sana deli gibi âşıkmış 💗",
      "Harun'un kalbi hep seninmiş 💘",
      "Harun seni her şeyden çok seviyormuş 💞",
      "Yağmur, Harun'un en güzel hikâyesiymiş ✨"
    ];

    let clickCount = 0;

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function showLove(x, y) {
      clickCount += 1;

      const message = document.createElement("div");
      message.className = "love-message";
      message.textContent = messages[(clickCount - 1) % messages.length];

      const safeX = clamp(x, 130, window.innerWidth - 130);
      const safeY = clamp(y, 50, window.innerHeight - 55);
      message.style.left = `${safeX}px`;
      message.style.top = `${safeY}px`;
      document.body.appendChild(message);

      for (let i = 0; i < 7; i += 1) {
        const heart = document.createElement("span");
        heart.className = "floating-heart";
        heart.textContent = ["❤️", "💗", "💖", "💕"][Math.floor(Math.random() * 4)];
        heart.style.left = `${x + (Math.random() - 0.5) * 42}px`;
        heart.style.top = `${y + (Math.random() - 0.5) * 24}px`;
        heart.style.fontSize = `${16 + Math.random() * 19}px`;
        heart.style.setProperty("--drift", `${(Math.random() - 0.5) * 145}px`);
        heart.style.setProperty("--rotate", `${(Math.random() - 0.5) * 90}deg`);
        heart.style.setProperty("--duration", `${1.6 + Math.random() * 1.2}s`);
        document.body.appendChild(heart);
        heart.addEventListener("animationend", () => heart.remove());
      }

      document.getElementById("counter").textContent = `Sevgi mesajı: ${clickCount}`;
      message.addEventListener("animationend", () => message.remove());
    }

    document.addEventListener("pointerdown", (event) => {
      showLove(event.clientX, event.clientY);
    });

    window.addEventListener("load", () => {
      window.setTimeout(() => {
        showLove(window.innerWidth / 2, Math.min(window.innerHeight * 0.78, window.innerHeight - 70));
      }, 750);
    });
  </script>
</body>
</html>
