<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#210b31" />
  <meta name="description" content="Yağmur'a Harun'dan küçük bir sevgi mesajı." />
  <title>Yağmur'a, Harun'dan ❤️</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { width: 100%; min-height: 100%; margin: 0; }

    body {
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #fff9fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      user-select: none;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 75, 140, .38), transparent 31%),
        radial-gradient(circle at 86% 20%, rgba(145, 92, 255, .34), transparent 33%),
        linear-gradient(145deg, #12051e, #310f47 58%, #180722);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .32;
      background-image:
        radial-gradient(circle, #fff 0 1px, transparent 1.4px),
        radial-gradient(circle, #ffd1e2 0 1px, transparent 1.5px);
      background-position: 0 0, 36px 54px;
      background-size: 82px 82px, 112px 112px;
      animation: stars 17s linear infinite;
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(620px, 100%);
      padding: clamp(32px, 8vw, 60px) clamp(22px, 7vw, 56px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 34px;
      background: rgba(255,255,255,.09);
      box-shadow: 0 30px 90px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.18);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: enter .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .main-heart {
      display: inline-block;
      margin-bottom: 15px;
      font-size: clamp(58px, 15vw, 82px);
      filter: drop-shadow(0 12px 25px rgba(255, 71, 137, .48));
      animation: heartbeat 1.45s ease-in-out infinite;
    }

    .small-title {
      margin: 0 0 10px;
      color: #ffd2e3;
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .21em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 10vw, 5rem);
      line-height: .98;
      letter-spacing: -.045em;
      color: transparent;
      background: linear-gradient(110deg, #fff 15%, #ffd0e2 50%, #cbb7ff 88%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .subtitle {
      max-width: 450px;
      margin: 20px auto 0;
      color: rgba(255,249,252,.82);
      font-size: clamp(1rem, 3.8vw, 1.17rem);
      line-height: 1.65;
    }

    .hint {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 27px;
      padding: 12px 18px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      background: linear-gradient(120deg, rgba(255,79,145,.24), rgba(143,92,255,.24));
      font-size: .92rem;
      font-weight: 750;
      animation: hint 2s ease-in-out infinite;
    }

    .signature {
      margin-top: 24px;
      color: rgba(255,212,229,.88);
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
    }

    .message {
      position: fixed;
      z-index: 20;
      max-width: 86vw;
      padding: 12px 17px;
      color: #3a0c25;
      background: rgba(255,249,252,.97);
      border: 1px solid rgba(255,79,145,.2);
      border-radius: 999px;
      box-shadow: 0 14px 36px rgba(0,0,0,.28);
      font-size: clamp(.86rem, 3.6vw, 1rem);
      font-weight: 850;
      white-space: nowrap;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: pop 2.35s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .floating-heart {
      position: fixed;
      z-index: 15;
      pointer-events: none;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 7px 10px rgba(0,0,0,.2));
      animation: float var(--time) ease-out forwards;
    }

    .counter {
      position: fixed;
      z-index: 30;
      right: max(13px, env(safe-area-inset-right));
      bottom: max(13px, env(safe-area-inset-bottom));
      padding: 9px 13px;
      color: rgba(255,249,252,.77);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 999px;
      background: rgba(18,6,31,.46);
      backdrop-filter: blur(10px);
      font-size: .74rem;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(28px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.13); }
      27% { transform: scale(1); }
      40% { transform: scale(1.08); }
      55% { transform: scale(1); }
    }

    @keyframes hint { 50% { transform: translateY(-4px); } }
    @keyframes stars { to { background-position: 82px 82px, -76px 166px; } }

    @keyframes pop {
      0% { opacity: 0; transform: translate(-50%, -35%) scale(.65); }
      15% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
      27% { transform: translate(-50%, -50%) scale(1); }
      73% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -140%) scale(.94); }
    }

    @keyframes float {
      0% { opacity: 0; transform: translate(-50%, -30%) scale(.55) rotate(0); }
      15% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--drift)), -190px) scale(1.25) rotate(var(--rotate));
      }
    }

    @media (max-width: 520px) {
      body { padding: 15px; }
      .card { border-radius: 28px; }
    }
  </style>
</head>
<body aria-label="Ekrana her dokunduğunda Harun'un sevgi mesajı görünür.">
  <main class="card">
    <div class="main-heart" aria-hidden="true">❤️</div>
    <p class="small-title">Harun'dan küçük bir not</p>
    <h1>Yağmur'um</h1>
    <p class="subtitle">
      Ekranın herhangi bir yerine dokun. Harun'un sana söylemek istediği şey her defasında yeniden karşına çıksın.
    </p>
    <div class="hint"><span aria-hidden="true">👆</span> Ekrana dokun</div>
    <div class="signature">Daima senin, Harun.</div>
  </main>

  <div class="counter" id="counter" aria-live="polite">Sevgi mesajı: 0</div>

  <script>
    let count = 0;

    const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

    function showLove(x, y) {
      count += 1;

      const message = document.createElement("div");
      message.className = "message";
      message.textContent = "Harun seni çok seviyormuş ❤️";
      message.style.left = `${clamp(x, 128, window.innerWidth - 128)}px`;
      message.style.top = `${clamp(y, 48, window.innerHeight - 55)}px`;
      document.body.appendChild(message);
      message.addEventListener("animationend", () => message.remove());

      for (let i = 0; i < 7; i += 1) {
        const heart = document.createElement("span");
        heart.className = "floating-heart";
        heart.textContent = ["❤️", "💗", "💖", "💕"][Math.floor(Math.random() * 4)];
        heart.style.left = `${x + (Math.random() - .5) * 42}px`;
        heart.style.top = `${y + (Math.random() - .5) * 24}px`;
        heart.style.fontSize = `${16 + Math.random() * 19}px`;
        heart.style.setProperty("--drift", `${(Math.random() - .5) * 145}px`);
        heart.style.setProperty("--rotate", `${(Math.random() - .5) * 90}deg`);
        heart.style.setProperty("--time", `${1.6 + Math.random() * 1.15}s`);
        document.body.appendChild(heart);
        heart.addEventListener("animationend", () => heart.remove());
      }

      document.getElementById("counter").textContent = `Sevgi mesajı: ${count}`;
    }

    document.addEventListener("pointerdown", event => showLove(event.clientX, event.clientY));

    window.addEventListener("load", () => {
      setTimeout(() => showLove(window.innerWidth / 2, Math.min(window.innerHeight * .78, window.innerHeight - 70)), 700);
    });
  </script>
</body>
</html>
